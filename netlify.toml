# Static site — no build step. Netlify publishes the repo root as-is.
[build]
  publish = "."
  command = ""

# หน้าแรกกับรายการวันต้องสดเสมอ (เปลี่ยนทุกเช้า)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/data/manifest.js"
  [headers.values]
    Cache-Control = "no-cache"

# ไฟล์ข่าวรายวันโหลดพร้อม ?v=<stamp> จาก manifest จึง cache ได้
[[headers]]
  for = "/data/days/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
